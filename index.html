<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#090d1c">
  <title>NEXORA — غرف صوتية</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="app">
    <header class="top">
      <div class="logo">N<span>EX</span>ORA</div>
      <div class="live"><i></i> مساحة تجمعنا</div>
    </header>

    <section id="welcome" class="panel welcome">
      <div class="orb">🎙️</div>
      <p class="eyebrow">أهلاً بك في عالم NEXORA</p>
      <h1>صوتك يقرّبنا</h1>
      <p class="sub">أنشئ غرفة صوتية وادعُ أصدقاءك برابط واحد.</p>
      <label for="name">اسمك داخل الغرفة</label>
      <input id="name" maxlength="24" placeholder="اكتب اسمك" autocomplete="nickname">
      <button id="createBtn" class="primary">إنشاء غرفة صوتية</button>
      <div class="or">أو</div>
      <label for="roomInput">لديك رابط دعوة؟</label>
      <input id="roomInput" placeholder="الصق رمز الغرفة">
      <button id="joinBtn" class="secondary">دخول الغرفة</button>
      <p class="tiny">نسخة تجريبية — بدون إنشاء حساب</p>
    </section>

    <section id="room" class="panel room hidden">
      <div class="room-head">
        <div><p class="eyebrow">غرفة صوتية مباشرة</p><h2 id="roomTitle">غرفتي</h2></div>
        <span class="count" id="count">0 / 8</span>
      </div>
      <div class="invite">
        <input id="inviteLink" readonly>
        <button id="copyBtn">نسخ الدعوة</button>
      </div>
      <div id="status" class="status">جارٍ الاتصال…</div>
      <div id="people" class="people"></div>
      <div class="controls">
        <button id="muteBtn" class="round">🎙️<small>كتم المايك</small></button>
        <button id="leaveBtn" class="round leave">✕<small>مغادرة</small></button>
      </div>
      <div class="chat">
        <h3>الدردشة الكتابية</h3>
        <div id="messages" class="messages"></div>
        <form id="chatForm"><input id="chatInput" maxlength="500" placeholder="اكتب رسالة…"><button>إرسال</button></form>
      </div>
    </section>
    <footer> NEXORA <span>•</span> تواصل بصوتك</footer>
  </main>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/app.js"></script>
</body>
</html>
